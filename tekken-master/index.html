<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Personagens de Tekken 6</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="character-card">
        <div class="image-section">
            <img src="https://cdn.dashfight.com/cfff78d032e1eb5520e9a5d6530a7b0649f906f6_480.png"
                alt="Alisa Bosconovitch">
        </div>
        <div class="info-section">
            <h2>ALISA BOSCONOVITCH</h2>
            <p class="subtitle">Are you ready for a world of pain?</p>
            <div class="stats">
                <div class="attribute">
                    <span>Evasiveness</span>
                    <div class="bar" data-value="6"></div>
                </div>

                <div class="attribute">
                    <span>Combo Damage</span>
                    <div class="bar" data-value="7"></div>
                </div>

                <div class="attribute">
                    <span>Mobility</span>
                    <div class="bar" data-value="5"></div>
                </div>

                <div class="attribute">
                    <span>Wall Carry</span>
                    <div class="bar" data-value="7"></div>
                </div>

                <div class="attribute">
                    <span>Throw Game</span>
                    <div class="bar" data-value="2"></div>
                </div>

                <div class="attribute">
                    <span>Difficulty</span>
                    <div class="bar" data-value="5"></div>
                </div>
            </div>
        </div>
    </div>
